[project]
name = "studyflow"
version = "1.0.0"
default-app = "web"
jac-version = "==0.37.23"

[apps.web]
kind = "web-app"
entry-point = "web.main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.mobile.dependencies]
[apps.mobile.dependencies.npm]
react-native-web = "^0.21.2"

[apps.cli]
kind = "cli"
entry-point = "cli.main"

[apps.cli.check]
[apps.cli.check.lint]
ignore = ["no-print"]

[apps.planner]
kind = "service"
entry-point = "core.planner_service"

[test]
directories = ["core"]

[check]
# Jac 0.37.23 emits these false positives for intrinsic JSX tags, StyleSheet
# object keys, and compiler-generated reactive setters. Real errors remain on.
suppress = ["W1051", "W2001", "W2003"]

[check.lint]
select = ["all"]

[client]
[client.app_meta_data]
title = "StudyFlow — Smart Student Planner"
description = "Turn deadlines and estimated work into a realistic daily study plan."
theme_color = "#4f46e5"
